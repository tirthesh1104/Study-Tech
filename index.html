<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Curriculum & Attendance App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
          --bg-primary: #0f172a; /* slate-900 */
          --bg-secondary: #1e293b; /* slate-800 */
          --accent-primary: #6366f1; /* indigo-500 */
          --accent-secondary: #a855f7; /* purple-500 */
          --text-primary: #f8fafc; /* slate-50 */
          --text-secondary: #94a3b8; /* slate-400 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }
        ::-webkit-scrollbar-track {
          background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
          background: #334155; /* slate-700 */
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #475569; /* slate-600 */
        }

        /* Glassmorphism utility */
        .glass {
          background: rgba(30, 41, 59, 0.7);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fade-in-down {
          from {
            opacity: 0;
            transform: translateY(-20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .animate-fade-in-down {
          animation: fade-in-down 0.5s ease-out forwards;
        }

        /* --- Animation & Transformation Layer --- */

        /* 2. Scroll Animations */
        .fade-in-up-on-scroll {
          opacity: 0;
          transform: translateY(30px);
          transition: opacity 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), 
                      transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .fade-in-up-on-scroll.is-visible {
          opacity: 1;
          transform: translateY(0);
        }

        /* 3. Interactive UI Elements */
        .interactive-card {
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .interactive-card:hover {
          transform: translateY(-4px);
          background: rgba(30, 41, 59, 0.8);
          border-color: rgba(99, 102, 241, 0.3);
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }
        
        /* Tab underline animation */
        .tab-button {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }
        .tab-button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .tab-button::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: var(--accent-primary);
            transition: all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform: translateX(-50%);
        }
        .tab-button.active {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.1);
        }
        .tab-button.active::after {
            width: 60%;
        }

    </style>
</head>
  <body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; font-family: sans-serif;">
            Loading Smart Campus...
        </div>
    </div>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
